name: Mantener Streamlit Despierto

on:
  schedule:
    # Se ejecuta cada 2 días a las 00:00 UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar timestamp
        run: |
          echo "Last ping: $(date)" > ping.txt
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ping.txt
          git commit -m "chore: keep alive ping [skip ci]" || exit 0
          git push
